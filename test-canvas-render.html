<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Render Test</title>
    <style>
        body { margin: 0; background: #000033; }
        canvas { display: block; }
        #debug { 
            position: fixed; 
            top: 10px; 
            left: 10px; 
            color: white; 
            background: rgba(0,0,0,0.8); 
            padding: 10px;
            font-family: monospace;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="debug">Checking...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const debug = document.getElementById('debug');
        
        function log(msg) {
            debug.innerHTML += '<br>' + msg;
            console.log(msg);
        }
        
        log('Starting test...');
        log('THREE available: ' + (typeof THREE !== 'undefined'));
        log('Document ready state: ' + document.readyState);
        
        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        function init() {
            log('DOM ready, initializing...');
            
            try {
                // Create scene
                const scene = new THREE.Scene();
                log('Scene created');
                
                // Create camera
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 20, 20);
                log('Camera created');
                
                // Create renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setClearColor(0x000033, 1.0);
                renderer.setSize(window.innerWidth, window.innerHeight);
                log('Renderer created');
                
                // Append to body
                document.body.appendChild(renderer.domElement);
                log('Canvas appended to body');
                log('Canvas element: ' + renderer.domElement.tagName);
                log('Canvas size: ' + renderer.domElement.width + 'x' + renderer.domElement.height);
                
                // Add a light
                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(10, 10, 10);
                scene.add(light);
                log('Light added');
                
                // Add a test cube
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                log('Test cube added');
                
                // Render
                camera.lookAt(0, 0, 0);
                renderer.render(scene, camera);
                log('First render complete');
                
                // Animate
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
                log('Animation started');
                
            } catch (error) {
                log('ERROR: ' + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
