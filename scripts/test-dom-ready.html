<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Ready Check Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }
        .pass {
            border-left: 4px solid #00ff00;
        }
        .info {
            border-left: 4px solid #00ffff;
        }
        h1 {
            color: #00ffff;
        }
        code {
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 3px;
            color: #ffff00;
        }
    </style>
</head>
<body>
    <h1>DOM Ready Check Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        // Test 1: Check document.readyState
        addResult(`Current document.readyState: <code>${document.readyState}</code>`, 'info');

        // Test 2: Verify readyState is not 'loading' (since this script runs after DOM is parsed)
        if (document.readyState !== 'loading') {
            addResult('✓ DOM is ready (readyState is not "loading")', 'pass');
        } else {
            addResult('✗ DOM is still loading', 'info');
        }

        // Test 3: Simulate the logic from script.js
        let initMethod = '';
        if (document.readyState === 'loading') {
            initMethod = 'Would wait for DOMContentLoaded event';
        } else {
            initMethod = 'Would initialize immediately';
        }
        addResult(`Initialization method: <code>${initMethod}</code>`, 'info');

        // Test 4: Verify DOM elements are accessible
        const bodyExists = document.body !== null;
        const resultsExists = document.getElementById('results') !== null;
        
        if (bodyExists && resultsExists) {
            addResult('✓ DOM elements are accessible', 'pass');
        }

        // Test 5: Test DOMContentLoaded event
        let domContentLoadedFired = false;
        document.addEventListener('DOMContentLoaded', () => {
            domContentLoadedFired = true;
            addResult('✓ DOMContentLoaded event fired (or already fired)', 'pass');
        });

        // If DOMContentLoaded already fired, it won't fire again
        setTimeout(() => {
            if (!domContentLoadedFired) {
                addResult('ℹ DOMContentLoaded already fired before this script ran', 'info');
            }
        }, 100);

        // Test 6: Demonstrate the three readyState values
        addResult(`<strong>ReadyState values:</strong><br>
            • <code>loading</code>: DOM is still loading<br>
            • <code>interactive</code>: DOM is parsed, resources still loading<br>
            • <code>complete</code>: DOM and all resources loaded`, 'info');

        // Test 7: Show the implementation pattern
        addResult(`<strong>Implementation in script.js:</strong><br>
            <code>if (document.readyState === 'loading') {<br>
            &nbsp;&nbsp;document.addEventListener('DOMContentLoaded', startGameWhenReady);<br>
            } else {<br>
            &nbsp;&nbsp;startGameWhenReady();<br>
            }</code>`, 'info');
    </script>
</body>
</html>
