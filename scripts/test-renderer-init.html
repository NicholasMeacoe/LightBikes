<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renderer Initialization Test</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif;
        }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
            max-width: 400px;
        }
        #info h3 {
            margin: 0 0 10px 0;
            color: #00ffff;
        }
        #info p {
            margin: 5px 0;
            font-size: 14px;
        }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 5px;
        }
        .status.pass {
            background: #00ff00;
            color: #000;
        }
        .status.fail {
            background: #ff0000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Renderer Initialization Test</h3>
        <p>WebGL Support: <span id="webgl-status" class="status">Checking...</span></p>
        <p>Clear Color: <span id="color-status" class="status">Checking...</span></p>
        <p>Canvas Attached: <span id="canvas-status" class="status">Checking...</span></p>
        <p>Lighting: <span id="lighting-status" class="status">Checking...</span></p>
        <p id="result-message" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Test 1: WebGL Availability Check
        function checkWebGLSupport() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                
                if (!gl || !window.WebGLRenderingContext) {
                    return false;
                }
                
                return true;
            } catch (e) {
                console.error('WebGL check failed:', e);
                return false;
            }
        }

        function updateStatus(elementId, passed, message) {
            const element = document.getElementById(elementId);
            element.textContent = passed ? 'PASS' : 'FAIL';
            element.className = 'status ' + (passed ? 'pass' : 'fail');
            if (message) {
                element.title = message;
            }
        }

        // Run tests
        let allPassed = true;

        // Test 1: WebGL Support
        const webglSupported = checkWebGLSupport();
        updateStatus('webgl-status', webglSupported, webglSupported ? 'WebGL is available' : 'WebGL not available');
        allPassed = allPassed && webglSupported;

        if (!webglSupported) {
            document.getElementById('result-message').textContent = '❌ WebGL not supported - cannot proceed with tests';
            document.getElementById('result-message').style.color = '#ff0000';
        } else {
            // Test 2: Renderer Initialization with Clear Color
            try {
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 20, 20);
                
                const renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: false
                });
                
                // Set clear color to dark blue
                renderer.setClearColor(0x000033, 1.0);
                
                // Get the clear color to verify
                const clearColor = renderer.getClearColor();
                const clearColorHex = clearColor.getHex();
                const colorCorrect = clearColorHex === 0x000033;
                
                updateStatus('color-status', colorCorrect, 
                    colorCorrect ? 'Clear color is 0x000033 (dark blue)' : `Clear color is 0x${clearColorHex.toString(16)}`);
                allPassed = allPassed && colorCorrect;

                // Test 3: Canvas Attachment
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                
                const canvasAttached = document.body.contains(renderer.domElement);
                const canvasSize = renderer.domElement.width === window.innerWidth && 
                                  renderer.domElement.height === window.innerHeight;
                
                updateStatus('canvas-status', canvasAttached && canvasSize, 
                    canvasAttached ? 'Canvas attached and sized correctly' : 'Canvas not properly attached');
                allPassed = allPassed && canvasAttached && canvasSize;

                // Test 4: Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 1.0);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 20, 10);
                scene.add(directionalLight);
                
                const hasLighting = scene.children.some(child => 
                    child instanceof THREE.AmbientLight || child instanceof THREE.DirectionalLight
                );
                
                updateStatus('lighting-status', hasLighting, 
                    hasLighting ? 'Scene has ambient and directional lighting' : 'Lighting not added');
                allPassed = allPassed && hasLighting;

                // Add a test cube to verify rendering
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);

                camera.lookAt(cube.position);

                // Render the scene
                renderer.render(scene, camera);

                // Final result
                if (allPassed) {
                    document.getElementById('result-message').textContent = '✅ All tests passed! Renderer initialized correctly.';
                    document.getElementById('result-message').style.color = '#00ff00';
                } else {
                    document.getElementById('result-message').textContent = '⚠️ Some tests failed - see details above';
                    document.getElementById('result-message').style.color = '#ffaa00';
                }

                // Animate the cube
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();

            } catch (error) {
                console.error('Renderer initialization failed:', error);
                updateStatus('color-status', false, error.message);
                updateStatus('canvas-status', false, error.message);
                updateStatus('lighting-status', false, error.message);
                document.getElementById('result-message').textContent = '❌ Renderer initialization failed: ' + error.message;
                document.getElementById('result-message').style.color = '#ff0000';
            }
        }
    </script>
</body>
</html>
